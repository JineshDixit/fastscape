/roles:
  get:
    tags:
      - Roles
    summary: Get all roles with pagination
    security:
      - bearerAuth: []
    responses:
      '200':
        description: List of roles
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/Role'

  post:
    tags:
      - Roles
    summary: Create a new role
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Role'
    responses:
      '201':
        description: Role created

/roles/name/{name}:
  get:
    tags:
      - Roles
    summary: Get role by name
    security:
      - bearerAuth: []
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Role details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Role'

/roles/{id}:
  get:
    tags:
      - Roles
    summary: Get role by ID
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Role details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Role'

  put:
    tags:
      - Roles
    summary: Update role
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Role'
    responses:
      '200':
        description: Role updated

  delete:
    tags:
      - Roles
    summary: Delete role
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Role deleted

/roles/{id}/activate:
  put:
    tags:
      - Roles
    summary: Activate role
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Role activated

/roles/{id}/deactivate:
  put:
    tags:
      - Roles
    summary: Deactivate role
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Role deactivated

