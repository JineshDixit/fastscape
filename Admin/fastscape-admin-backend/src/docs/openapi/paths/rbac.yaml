      '200':
        description: Policy details

/policies/search/permission/{permission}:
  get:
    tags:
      - Policies
    summary: Search policies by permission
    security:
      - bearerAuth: []
    parameters:
      - name: permission
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Search results

/policies/{id}:
  get:
    tags:
      - Policies
    summary: Get policy by ID
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Policy details

/policies/{id}/roles:
  get:
    tags:
      - Policies
    summary: Get roles that have this policy
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: List of roles

/policies/{id}/permissions:
  put:
    tags:
      - Policies
    summary: Add permission to policy
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              permission:
                type: string
    responses:
      '200':
        description: Permission added

  delete:
    tags:
      - Policies
    summary: Remove permission from policy
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Permission removed

/policies/{id}/activate:
  put:
    tags:
      - Policies
    summary: Activate policy
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Policy activated

/policies/{id}/deactivate:
  put:
    tags:
      - Policies
    summary: Deactivate policy
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Policy deactivated
