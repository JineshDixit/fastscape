/users:
  get:
    tags:
      - Users
    summary: Get all users with filters and pagination
    security:
      - bearerAuth: []
    parameters:
      - name: verificationStatus
        in: query
        schema:
          type: string
          enum: [PENDING, VERIFIED, REJECTED]
      - name: isBlocked
        in: query
        schema:
          type: boolean
      - name: country
        in: query
        schema:
          type: string
      - name: city
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
      - name: limit
        in: query
        schema:
          type: integer
    responses:
      '200':
        description: List of users
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/User'

/users/export:
  get:
    tags:
      - Users
    summary: Export users (clients) to CSV
    security:
      - bearerAuth: []
    responses:
      '200':
        description: CSV file download

/users/{id}:
  get:
    tags:
      - Users
    summary: Get single user details
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: User details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'

/users/{id}/verification-status:
  put:
    tags:
      - Users
    summary: Update user verification status
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              verificationStatus:
                type: string
                enum: [PENDING, VERIFIED, REJECTED]
    responses:
      '200':
        description: Status updated

/users/{id}/block:
  put:
    tags:
      - Users
    summary: Block or unblock a user
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              isBlocked:
                type: boolean
              reason:
                type: string
    responses:
      '200':
        description: User block status updated
