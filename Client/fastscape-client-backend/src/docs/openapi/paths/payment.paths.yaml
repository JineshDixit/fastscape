/payments/webhook:
  post:
    tags:
      - Payments
    summary: Stripe webhook handler
    responses:
      '200':
        description: Webhook processed
/payments/calculate/{bookingId}:
  get:
    tags:
      - Payments
    summary: Calculate pricing breakdown for a booking
    security:
      - bearerAuth: []
    parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Payment calculation result
/payments/intent/{bookingId}:
  post:
    tags:
      - Payments
    summary: Create a Stripe PaymentIntent
    security:
      - bearerAuth: []
    parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - paymentType
            properties:
              paymentType:
                type: string
                enum: [DEPOSIT, BALANCE, FULL]
    responses:
      '200':
        description: PaymentIntent created
