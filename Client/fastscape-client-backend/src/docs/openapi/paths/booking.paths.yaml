/bookings:
  get:
    tags:
      - Bookings
    summary: List current user's bookings
    security:
      - bearerAuth: []
    responses:
      '200':
        description: A list of bookings
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Booking'
  post:
    tags:
      - Bookings
    summary: Create a new booking
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - vehicleId
              - startDatetime
              - endDatetime
            properties:
              vehicleId:
                type: string
                format: uuid
              startDatetime:
                type: string
                format: date-time
              endDatetime:
                type: string
                format: date-time
    responses:
      '201':
        description: Booking created successfully
/bookings/upcoming:
  get:
    tags:
      - Bookings
    summary: Get user's upcoming bookings
    security:
      - bearerAuth: []
    responses:
      '200':
        description: List of upcoming bookings
/bookings/active:
  get:
    tags:
      - Bookings
    summary: Get user's currently active bookings
    security:
      - bearerAuth: []
    responses:
      '200':
        description: List of active bookings
/bookings/stats:
  get:
    tags:
      - Bookings
    summary: Get user's booking statistics
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Booking stats
/bookings/history:
  get:
    tags:
      - Bookings
    summary: Get user's booking history
    security:
      - bearerAuth: []
    responses:
      '200':
        description: History of bookings
/bookings/{bookingId}:
  get:
    tags:
      - Bookings
    summary: Get detailed booking info
    security:
      - bearerAuth: []
    parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Booking details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Booking'
  put:
    tags:
      - Bookings
    summary: Update booking details
    security:
      - bearerAuth: []
    parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Booking updated
  delete:
    tags:
      - Bookings
    summary: Cancel booking
    security:
      - bearerAuth: []
    parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Booking cancelled
